[build]
  publish = "web"
  functions = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    # only our own code may run on the page: protects the tokens in memory
    Content-Security-Policy = "default-src 'self'; connect-src 'self' https://www.googleapis.com; img-src 'self' data:; style-src 'self'; script-src 'self'; frame-ancestors 'none'"
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
